services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studytube
      POSTGRES_USER: studytube
      POSTGRES_PASSWORD: studytube
    ports:
      - "5432:5432"
    volumes:
      - studytube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studytube -d studytube"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studytube_pgdata:
